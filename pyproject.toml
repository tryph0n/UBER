[project]
name = "uber-hotzones"
version = "1.0.0"
description = "Uber NYC Hot-Zones Clustering Analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.31.0",
    "jupyter>=1.0.0",
    "geopandas>=0.14.0",
    "pyarrow>=14.0.0",
    "kaleido>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
